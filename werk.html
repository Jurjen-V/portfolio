  <script>
  const isMobile = window.matchMedia('(max-width: 768px)').matches;
  const qs = new URLSearchParams(location.search);
  const params = Object.fromEntries(qs.entries());
  const has = (k) => Object.prototype.hasOwnProperty.call(params, k);
  const pick = (obj, keys) => keys.reduce((o,k)=>{ if (obj[k] != null) o[k]=obj[k]; return o; },{});
  const withQs = (url, extra={}) => {
    const fwd = pick(params, Object.keys(params).filter(k=>!['bannerId','title','brand'].includes(k)));
    Object.assign(fwd, extra);
    const s = new URLSearchParams(fwd).toString();
    return s ? url+(url.includes('?')?'&':'?')+s : url;
  };
  function humanizeId(id){
    if(!id) return '';
    const spaced = id.replace(/[-_]+/g,' ').replace(/top/gi,' Top ').replace(/\s+/g,' ').trim();
    const lowers = new Set(['en','de','het','van','voor','bij','op','een','der']);
    return spaced.split(' ').map((w,i)=>i&&lowers.has(w.toLowerCase())?w.toLowerCase():w[0]?w[0].toUpperCase()+w.slice(1):w).join(' ');
  }
const CAMPAIGNS = {

  },

        <li>Interactief spel geïntegreerd in de site skin</li>

  "videoland-sleepers": {

    text: `

  const IAB_FORMATS = [
    { size:'300x600', label:'Half Page',  meta:['HTML','CSS','JavaScript','GSAP'] },
    { size:'300x250', label:'Square',     meta:['HTML','CSS','JavaScript','GSAP'] },
    { size:'970x250', label:'Billboard',  meta:['HTML','CSS','JavaScript','GSAP'], fullwidth:true },
  ];
  const TITLE_BY_ID = { 'joe-80stop800-2025':'Joe 80s Top 800','joe-80stop800-2025-skin':'Joe 80s Top 800','qmusic-new-top-1020-2025':'Qmusic Top 1020' };
  const BRAND_MAP = { joe:'Joe', qmusic:'Qmusic' };

  function mountCampaignText(rawId){
    const baseId = rawId.replace(/-skin$/,'');
    const campaign = CAMPAIGNS[baseId];
    if(!campaign) return;
    const panel = document.getElementById('campaign-info');
    panel.querySelector('.campaign-text').innerHTML = campaign.text;
    panel.hidden = false;
  }
  function renderCard({size,label,meta=[],fullwidth}){
    const [w,h] = size.split('x').map(Number);
    const art = document.createElement('article');
    art.className = 'card'+(fullwidth?' fullwidth':'');
    art.dataset.size = size;
    const hdr = document.createElement('header');
    hdr.innerHTML = `<div><strong>${label}</strong><div class="size">${w} × ${h}</div></div><div class="meta">${meta.map(m=>`<span class="badge">${m}</span>`).join('')}</div>`;
    const ifr = document.createElement('iframe');
    ifr.className='banner'; ifr.title=`${size} – bannerframe`; ifr.width=w+1; ifr.height=h+1; ifr.loading='lazy'; ifr.allow='autoplay';
    art.append(hdr,ifr);
    return art;
  }
  function mountGallery(baseId){
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';
    const campaign = CAMPAIGNS[baseId];
    const show = campaign?.formats || IAB_FORMATS.map(f=>f.size);
    IAB_FORMATS.forEach(cfg=>{
      if(!show.includes(cfg.size)) return;
      if(isMobile && cfg.size==='970x250'){ const m=document.createElement('div'); m.className='card message'; m.innerHTML=`<p>Dit formaat is niet beschikbaar op mobiel.</p>`; gallery.appendChild(m); return; }
      gallery.appendChild(renderCard(cfg));
    });
    gallery.querySelectorAll('article.card[data-size] iframe.banner').forEach(f=>{
      const size = f.closest('article.card').dataset.size;
      f.src = withQs(`./banners/${size}/${baseId}-${size}/index.html`);
    });
  }
  function mountSkin(skinId){
    const panel = document.getElementById('skin-panel');
    if(isMobile){ panel.innerHTML=`<div class="skin-message"><p>De site skin is alleen zichtbaar op desktop.</p></div>`; panel.hidden=false; return; }
    const topEl=panel.querySelector('.skin-top iframe'), leftEl=panel.querySelector('.skin-left iframe'), rightEl=panel.querySelector('.skin-right iframe');
    const dTop=withQs(`./banners/skin/${skinId}/top.html`), mTop=withQs(`./banners/skin/${skinId}/768x100/index.html`);
    const mq=window.matchMedia('(max-width:900px)');
    const setTop=()=>{ if(topEl) topEl.src=mq.matches?mTop:dTop; };
    setTop(); mq.addEventListener?.('change',setTop);
    if(leftEl) leftEl.src=withQs(`./banners/skin/${skinId}/left.html`);
    if(rightEl) rightEl.src=withQs(`./banners/skin/${skinId}/right.html`);
    panel.hidden=false;
  }
  function updateTitleAndBrand(rawId){
    const baseId=rawId.replace(/-skin$/,'');
    const mapped=params.title?decodeURIComponent(params.title):(TITLE_BY_ID[rawId]||TITLE_BY_ID[baseId]);
    document.getElementById('page-title').textContent = mapped||humanizeId(baseId);
    const slug=baseId.split('-')[0]||'';
    const tc=(s)=>String(s||'').split(/[-_ ]+/).filter(Boolean).map(w=>w[0]?w[0].toUpperCase()+w.slice(1).toLowerCase():'').join(' ');
    document.getElementById('brand-chip').textContent = (params.brand||'').trim()||BRAND_MAP[slug.toLowerCase()]||tc(slug)||'Brand';
  }
  (function init(){
    document.getElementById('year').textContent = new Date().getFullYear();
    const rawId=(params.bannerId||'').trim();
    if(!rawId) return;
    const isSkinOnly=rawId.endsWith('-skin');
    const baseId=rawId.replace(/-skin$/,'');
    if(!isSkinOnly) mountGallery(baseId);
    if(isSkinOnly) document.querySelector('[aria-label="IAB formaten"]').style.display='none';
    const campaign=CAMPAIGNS[baseId];
    const hasSkin=campaign?.skin!==false;
    if(hasSkin){ mountSkin(isSkinOnly?rawId:`${baseId}-skin`); } else { const p=document.getElementById('skin-panel'); if(p) p.style.display='none'; }
    updateTitleAndBrand(rawId);
    mountCampaignText(rawId);
    window.addEventListener('keydown',(e)=>{ if(e.key==='Escape') document.activeElement?.blur?.(); });
  })();
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>
  <script src="gsap.js"></script>
