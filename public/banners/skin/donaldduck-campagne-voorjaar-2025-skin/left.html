<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="all.css">

  <div id="stage" class="hiddenOnload">

	<div class="clicklayer" onclick="PEXI.click()"></div>

		<!-- <img src="top_copy_1.svg" alt="" class="copy"> -->
		 <div class="copy">Klik op de puzzelstukjes om ze te<br>draaien tot ze perfect passen.</div>

				</div>
				<div class="row6">

      <div class="cta" onclick="PEXI.click()">
		<div class="ctaCopy">Bestel snel</div>
		<img src="arrow.svg" alt="" class="arrow">
	  </div>

    </div>
