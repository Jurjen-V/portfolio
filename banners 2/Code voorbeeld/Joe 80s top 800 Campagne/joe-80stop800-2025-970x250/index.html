<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" type="text/css" href="style.css">
	<meta name="viewport" content="width=device-width, initial-scale=1.0 maximum-scale=1, user-scalable=no">
	
</head>

<body>

	<div id="stage" class="hiddenOnload" onclick="pexi.click();">

		<div class="ring" id="cirkel"></div>
		<div class="ring1" id="cirkel1"></div>
		<div id="intro1"></div>
		<div id="intro2"></div>
		<div class="gradient"></div>

		<div class="nu_op_je_radio">NU OP JE RADIO</div>
	<div class="player">
			<div class="cover">
				<img src="play.svg" alt="play button" class="play">
				<div class="covergradient"></div>

				<img src="pause.svg" alt="pause button" class="pause">
				<div class="positie">321</div>
			</div>
			<div class="playerCopy">
				<div class="copyoverflow">
					<div class="nowplaying">NU OP JE RADIO</div>
					<div class="title">Never Gonna Give You Up</div>
					<div class="artist">Rick Astley</div>
				</div>
			</div>
			<div class="soundWave">
				<div class="box box1"></div>
				<div class="box box2"></div>
				<div class="box box3"></div>
				<div class="box box4"></div>
				<div class="box box5"></div>
				<div class="box box6"></div>
				<div class="box box7"></div>
				<div class="box box8"></div>
				<div class="box box9"></div>
				<div class="box box10"></div>
				<div class="box box11"></div>
				<div class="box box12"></div>
				<div class="box box13"></div>
				<div class="box box14"></div>
				<div class="box box15"></div>
				<div class="box box16"></div>
				<div class="box box17"></div>
				<div class="box box18"></div>
				<div class="box box19"></div>
				<div class="box box20"></div>
				<div class="box box21"></div>
				<div class="box box21"></div>
				<div class="box box22"></div>
				<div class="box box23"></div>
				<div class="box box24"></div>
				<div class="box box25"></div>
				<div class="box box26"></div>
				<div class="box box27"></div>
				<div class="box box28"></div>
			</div>
		</div>
		<div class="songsoverflow">
			<div class="songs" id="songs">

			</div>
		</div>

		<div class="cta">
			<span class="ctaspan">Luister nu</span>
		</div>
	</div>

	<!-- JavaScript bestanden -->
	<script src="https://static.pexi.nl/general/jquery.min.js"></script>
	<script src="https://static.pexi.nl/general/gsap_3.9.1_min.js"></script>
	<script src="https://static.pexi.nl/general/lottie_5.7.11.min.js" type="text/javascript"></script>
	<script src="main.js"></script>
</body>

</html>
